name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Exact Flutter Version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 4. Scaffold Clean Android Project
        run: |
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build
          rm -rf test analysis_options.yaml
          
          # پرمیشن‌ها
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # تنظیم صریح minSdkVersion
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
          fi

      - name: 5. Copy App Source Files
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp lib/main.dart app_build/lib/main.dart

      - name: 6. Resolve Dependencies
        run: |
          cd app_build
          flutter pub get

      - name: 7. Build APK Release
        run: |
          cd app_build
          flutter build apk --release --no-shrink --no-tree-shake-icons

      - name: 8. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
