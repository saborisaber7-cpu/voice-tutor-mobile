name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK
        run: |
          # 1. ساخت پروژه تمیز بدون فایل‌های ناقص
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build

          # 2. اضافه کردن دسترسی‌های اندروید به Manifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # 3. روش رسمی و بدون شکست تنظیم minSdk روی 21
          echo "flutter.minSdkVersion=21" >> android/local.properties

          # 4. کپی فایل‌های اصلی کد و پکیج‌ها
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart

          # 5. دریافت پکیج‌ها و خروجی نهایی
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
