name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Application
        run: |
          # 1. ساخت پروژه تمیز
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build

          # 2. اضافه کردن پکیج‌های سازگار و تست‌شده
          flutter pub add record:^5.1.2 audioplayers:^6.0.0 http:^1.2.1 path_provider:^2.1.2

          # 3. دسترسی میکروفون و اینترنت
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # 4. تنظیم حداقل نسخه اندروید (سازگار با هر دو ساختار قدیم و جدید گریدل)
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +

          # 5. کپی کردن کد صفحه اصلی
          cp ../lib/main.dart lib/main.dart

          # 6. ساخت نهایی APK
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
