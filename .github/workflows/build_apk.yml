name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # ساخت پروژه تمیز
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build

          # اضافه کردن پرمیشن‌ها
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # انتقال کدهای شما به پروژه
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart

          # گرفتن پکیج‌ها
          flutter pub get

          # بیلد مستقیم با پاس دادن پارامتر minSdk به گریدل
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --extra-gen-snapshot-options=--suppress-unhandled-references || true
          cd android && ./gradlew assembleRelease -PminSdkVersion=23 -PtargetSdkVersion=34

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/android/app/build/outputs/apk/release/app-release.apk
