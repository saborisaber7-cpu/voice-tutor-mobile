name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # 1. ساخت اسکلت سالم فلاتر
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build

          # 2. اضافه کردن دسترسی‌های میکروفون و اینترنت
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # 3. تغییر قطعی minSdkVersion به 23 (الزام دقیق پکیج record)
          echo "flutter.minSdkVersion=23" >> android/local.properties
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle

          # 4. کپی کردن سورس و پکیج‌ها
          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart

          # 5. دریافت وابستگی‌ها و بیلد APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
