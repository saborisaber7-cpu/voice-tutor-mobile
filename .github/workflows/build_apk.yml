name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Scaffold Android Project
        run: |
          flutter create --org com.voicetutor --project-name voice_tutor_app app_build
          cd app_build
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          echo "flutter.minSdkVersion=23" >> android/local.properties
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +

      - name: 5. Copy App Source Files
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp lib/main.dart app_build/lib/main.dart

      - name: 6. Resolve Dependencies
        run: |
          cd app_build
          flutter pub get

      - name: 7. Analyze Dart Code
        run: |
          cd app_build
          flutter analyze

      - name: 8. Build APK (Verbose Mode)
        run: |
          cd app_build
          flutter build apk --release --verbose

      - name: 9. Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTutor-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
